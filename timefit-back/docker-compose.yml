services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: timefit-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - timefit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Spring Boot Application (dev)
  timefit-backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: timefit-backend
    env_file:
      - .env.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace                            # 소스 코드 마운트 (hot reload)
      - ./keys/jwt:/workspace/keys/jwt          # JWT 키 유지 (루트 기준)
      - ./keys/jwt:/workspace/web/keys/jwt      # JWT 키 유지 (web 서브모듈 기준)
      - gradle_cache:/root/.gradle          # Gradle 캐시
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - timefit-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: timefit-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl
      - ./init-certs.sh:/docker-entrypoint.d/00-init-certs.sh:ro
    environment:
      - BACKEND_HOST=${NGINX_BACKEND_HOST}
      - BACKEND_PORT=${NGINX_BACKEND_PORT}
      - NGINX_STATUS_ENABLED=${NGINX_STATUS_ENABLED}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - NGINX_HTTPS_ENABLED=${NGINX_HTTPS_ENABLED}
      - NGINX_DOMAIN_NAME=${NGINX_DOMAIN_NAME}
      - NGINX_HTTP_REDIRECT=${NGINX_HTTP_REDIRECT}
      - NGINX_RATE_LIMIT=${NGINX_RATE_LIMIT}
      - NGINX_RATE_BURST=${NGINX_RATE_BURST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    depends_on:
      - timefit-backend
    restart: unless-stopped
    networks:
      - timefit-network

  # Prometheus - 메트릭 수집
  prometheus:
    image: prom/prometheus:latest
    container_name: timefit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - timefit-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana - 메트릭 시각화
  grafana:
    image: grafana/grafana:latest
    container_name: timefit-grafana
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - timefit-network

  # Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    command:
      - '-nginx.scrape-uri=http://nginx:80/nginx_status'
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - timefit-network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  gradle_cache:

networks:
  timefit-network:
    driver: bridge