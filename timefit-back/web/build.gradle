dependencies {
    implementation project(':user')
    implementation project(':jpa-common')
    implementation project(':domain')

    // Core Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.auth0:java-jwt:4.0.0'

    // Monitoring & Management
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Utilities
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Email
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Optional (필요 시 주석 해제)
    // implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Testing
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
}

// 실행 가능한 JAR 생성 (web 모듈만)
jar {
    enabled = false
}

bootJar {
    enabled = true
    archiveClassifier = ''
}

// ========================================
// Scouter Agent 설정 (개발 환경)
// ========================================

bootRun {
    // 활성 프로필 확인
    def activeProfile = System.getenv('SPRING_PROFILES_ACTIVE') ?: 'dev'

    // 프로필별 env 파일 선택 (없으면 .env 폴백)
    def envFile = file("../.env.${activeProfile}")
    if (!envFile.exists()) {
        envFile = file('../.env')
    }

    if (envFile.exists()) {
        envFile.readLines().each { line ->
            if (line && !line.startsWith('#')) {
                def parts = line.split('=', 2)
                if (parts.length == 2) {
                    def key = parts[0].trim()
                    def value = parts[1].trim()
                    // 시스템 환경변수(Docker 주입값)가 없을 때만 설정
                    if (!System.getenv(key)) {
                        environment key, value
                    }
                }
            }
        }
    }

    // prod 프로필일 때만 JVM 튜닝 및 Scouter 적용
    if (activeProfile == 'prod') {
        // 공통 JVM 설정값
        def commonJvmArgs = [
                '-Xms1g',           // 초기 Heap 1GB
                '-Xmx2g',           // 최대 Heap 2GB (AWS m3.medium 기준)
                '-XX:+UseG1GC',     // G1 GC 사용
                '-XX:MaxGCPauseMillis=200'
        ]

        // Scouter Agent 설정 (파일이 있을 때만 활성화)
        def agentDir = file('../../timefit-test/scouter/agent.java')
        def agentJar = new File(agentDir, 'scouter.agent.jar')
        def agentConf = new File(agentDir, 'conf/scouter.conf')

        if (agentJar.exists()) {
            def objName = "timefit-${activeProfile}"
            jvmArgs = [
                    "-javaagent:${agentJar.absolutePath}",
                    "-Dscouter.config=${agentConf.absolutePath}",
                    "-Dobj_name=${objName}",
                    *commonJvmArgs
            ]
            println "🚀 Scouter Agent enabled: ${agentJar.absolutePath}"
        } else {
            jvmArgs = commonJvmArgs
            println "⚠️ Scouter Agent not found, skipping..."
        }
    }

    else {
        println " dev 프로필 — JVM 튜닝 및 Scouter 스킵"
    }
}